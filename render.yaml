services:
  - type: worker
    name: Botskingdoms-Renamer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: DB_URL
        sync: false
      - key: ADMIN
        sync: false
      - key: FORCE_SUB
        sync: false
      - key: START_PIC
        sync: false
      - key: LOG_CHANNEL
        sync: false
